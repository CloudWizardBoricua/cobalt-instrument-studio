<!doctype html>
<!-- Vite HTML entry: keep the root mount, main.tsx module and base-aware favicon aligned. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080F1F" />
    <meta
      name="description"
      content="An original industrial instrumentation simulator with reproducible operating scenarios, diagnostics, and inspectable engineering evidence."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Cobalt Instrument Studio</title>
  </head>
  <body>
    <!-- Accessible loading content remains visible until the browser-only React app mounts. -->
    <div id="root">
      <div role="status" style="padding: 32px; font-family: 'Segoe UI', sans-serif; color: #edf4ff; background: #080f1f; min-height: 100vh">
        Loading Cobalt Instrument Studio
      </div>
    </div>
    <noscript>This browser simulator requires JavaScript to generate and display simulated telemetry.</noscript>
    <!-- This module runs the simulator locally; it starts no hardware connection. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
