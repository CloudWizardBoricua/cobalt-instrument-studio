# Netlify static-demo contract: retain the root base, build command and publish directory.
# Netlify rebuilds main independently of GitHub's CI-to-Pages artifact gate.
# VITE_* values are public build configuration; no equipment gateway or secrets live here.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_BASE_PATH = "/"
  VITE_SOURCE_URL = "https://github.com/CloudWizardBoricua/cobalt-instrument-studio"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
