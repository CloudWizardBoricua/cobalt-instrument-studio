# Propose dependency updates for review; a green PR does not authorize a deployment or merge.
# Coordinated framework upgrades and Pages-action execution require their own validation.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
